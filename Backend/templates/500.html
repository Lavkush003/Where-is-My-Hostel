{% extends "base.html" %}

{% block title %}Something went wrong | {{ site_name }}{% endblock %}

{% block content %}
<section class="bg-slate-50 py-20">
    <div class="mx-auto max-w-2xl px-4 text-center sm:px-6">
        <p class="text-sm font-semibold uppercase tracking-wider text-brand-700">500</p>
        <h1 class="mt-3 text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl">Something went wrong</h1>
        <p class="mt-4 text-base leading-7 text-slate-600">We could not complete that request. Please try again in a moment.</p>
        <a href="{% url 'core:home' %}" class="btn-primary mt-8">Back to home</a>
    </div>
</section>
{% endblock %}
