{% extends "base.html" %}

{% block title %}Page not found | {{ site_name }}{% endblock %}

{% block content %}
<section class="bg-slate-50 py-20">
    <div class="mx-auto max-w-2xl px-4 text-center sm:px-6">
        <p class="text-sm font-semibold uppercase tracking-wider text-brand-700">404</p>
        <h1 class="mt-3 text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl">We could not find that page</h1>
        <p class="mt-4 text-base leading-7 text-slate-600">The link may be broken or the page may have moved.</p>
        <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
            <a href="{% url 'core:home' %}" class="btn-primary">Back to home</a>
            <a href="{% url 'properties:list' %}" class="btn-secondary">Browse stays</a>
        </div>
    </div>
</section>
{% endblock %}
