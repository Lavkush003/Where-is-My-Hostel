{% if messages %}
<div class="mx-auto max-w-7xl px-4 pt-4 sm:px-6 lg:px-8" aria-live="polite">
    {% for message in messages %}
        <div class="mb-3 rounded-lg border px-4 py-3 text-sm {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-800{% elif message.tags == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-800{% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-800{% else %}border-sky-200 bg-sky-50 text-sky-800{% endif %}" role="status">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}
